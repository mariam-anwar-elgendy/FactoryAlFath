<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر الشركة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .company-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 20px;
        }
        .company-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .company-icon {
            font-size: 5rem;
        }
        .welcome-text {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="text-white fw-bold mb-3 welcome-text">مرحباً {{ current_user.full_name }} 👋</h1>
            <p class="text-white-50 fs-5">اختر الشركة التي تريد الدخول إليها</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card company-card border-0 shadow-lg" onclick="window.location.href='{{ url_for('dashboard') }}'">
                    <div class="card-body text-center p-5">
                        <i class="fas fa-industry company-icon text-primary mb-4"></i>
                        <h3 class="fw-bold text-primary">🏭 مصنع الفتح</h3>
                        <p class="text-muted fs-5">إدارة المصنع والمحل والخزينة</p>
                        <span class="btn btn-primary btn-lg mt-3 w-100">دخول</span>
                    </div>
                </div>
            </div>
            
            <div class="col-md-5 mb-4">
                <div class="card company-card border-0 shadow-lg" onclick="window.location.href='{{ url_for('almasa_index') }}'">
                    <div class="card-body text-center p-5">
                        <i class="fas fa-building company-icon text-success mb-4"></i>
                        <h3 class="fw-bold text-success">🏗️ شركة الماسة</h3>
                        <p class="text-muted fs-5">إدارة الأوناش والشيكات والحسابات</p>
                        <span class="btn btn-success btn-lg mt-3 w-100">دخول</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-lg px-5">
                <i class="fas fa-sign-out-alt ms-2"></i> تسجيل خروج
            </a>
        </div>
    </div>
</body>
</html>
