{% extends "base.html" %}

{% block title %}تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 500px; margin: auto;">
    <div class="card-header bg-purple text-white fw-bold">
        🔑 تغيير كلمة المرور
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('settings_password') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">كلمة المرور الحالية</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">كلمة المرور الجديدة</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">تأكيد كلمة المرور الجديدة</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-purple w-100">تغيير</button>
        </form>
    </div>
</div>
{% endblock %}
