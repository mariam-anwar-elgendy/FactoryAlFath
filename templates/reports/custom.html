{% extends "base.html" %}

{% block title %}تقرير مخصص{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4 text-purple-dark">📊 تقرير مخصص</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="GET" action="{{ url_for('reports_custom') }}">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">نوع التقرير</label>
                    <select name="report_type" class="form-select">
                        <option value="factory">المصنع</option>
                        <option value="store">المحل</option>
                        <option value="treasury">الخزينة</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">من تاريخ</label>
                    <input type="date" name="from_date" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">إلى تاريخ</label>
                    <input type="date" name="to_date" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">&nbsp;</label>
                    <button type="submit" class="btn btn-purple w-100">عرض</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
